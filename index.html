function cls(s){s=String(s||"").toLowerCase();return s.includes("pass")||s.includes("eligible")&&!s.includes("not")?"ok":s.includes("fail")||s.includes("not eligible")?"bad":""}
function render(st){if(!st){app.innerHTML='<div class="empty"><b>Student not found</b>Please check the roll number.</div>';return}
let e=st.eligible||{},r=st.result||{},status=r.result||e.eligibility||"—";
app.innerHTML=`<div class="card"><div class="name">${esc(st.name)}</div><div class="roll">Roll: <b>${esc(st.roll)}</b></div><span class="badge ${cls(status)}">${esc(status)}</span></div>
<div class="section">Exam Result</div><div class="card"><div class="grid">
${item("Written",r.written)}${item("Oral",r.oral)}${item("Practical",r.practical)}${item("Total / 300",r.total)}
${item("MCQ + SBA",r.mcq_sba)}${item("G-A",r.g_a)}${item("G-B",r.g_b)}${item("G-C",r.g_c)}${item("G-D",r.g_d)}${item("F-A",r.f_a)}
</div></div>
<div class="section">Eligibility / Formative Assessment</div><div class="card"><div class="grid">
${item("Eligibility",e.eligibility)}${item("Lecture classes",e.lecture_classes)}${item("Tutorial classes",e.tutorial_classes)}${item("Practical classes",e.practical_classes)}
${item("Total classes present",e.total_classes_present)}${item("Attendance score",e.attendance_score)}${item("Item total marks",e.item_total_marks)}${item("Item score",e.item_score)}
${item("Class performance",e.class_performance)}${item("Class performance score",e.class_performance_score)}
</div></div>
<div class="section">Generic Topic</div><div class="card"><div class="grid">${item("Attendance (1)",e.generic_attendance)}${item("Assignments (4)",e.generic_assignments)}${item("Total GT",e.generic_total)}</div></div>
<div class="section">Integrated Teaching</div><div class="card"><div class="grid">${item("Attendance (2)",e.integrated_attendance)}${item("Assignments (8)",e.integrated_assignments)}${item("Total IT",e.integrated_total)}</div></div>`}
function findStudent(){let q=document.getElementById("q").value.trim();render(q?STUDENTS.find(s=>String(s.roll)===q):null)}
q.addEventListener("keydown",e=>{if(e.key==="Enter")findStudent()});
</script></body></html>
