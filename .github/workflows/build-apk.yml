name: Build KYAMC Student Lookup APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android source folders
        run: |
          mkdir -p app/src/main/java/com/kyamc/studentlookup
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp MainActivity.java app/src/main/java/com/kyamc/studentlookup/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp index.html app/src/main/assets/index.html
          cp styles.xml app/src/main/res/values/styles.xml

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KYAMC-Student-Lookup-APK
          path: app/build/outputs/apk/debug/app-debug.apk
